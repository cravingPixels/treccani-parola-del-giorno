name: Parola del giorno

on:
  schedule:
    # Cron is UTC and best-effort. We don't know when Treccani flips the word, so
    # we attempt every 30 min through the morning. 03:00-11:00 UTC covers roughly
    # 05:00-13:00 Europe/Rome across CET/CEST. scrape.py captures a word only when
    # it is genuinely new, and posts once at/after POST_HOUR (default 9) — so the
    # many attempts self-dedupe and a late Treccani update is still caught.
    - cron: "*/30 3-11 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Post now, ignoring the POST_HOUR gate (for manual runs)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: parola-del-giorno
  cancel-in-progress: false

jobs:
  word-of-day:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape, store and post
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          POST_HOUR: ${{ vars.POST_HOUR || '9' }}
        run: python scraper/scrape.py ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

      - name: Commit word if changed
        run: |
          if [ -n "$(git status --porcelain docs/data/words.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/data/words.json
            git commit -m "chore: parola del giorno $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "No change to words.json; nothing to commit."
          fi
